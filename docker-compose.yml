version: '3.8'

networks:
  obico_net:
    driver: bridge

services:
  # The Video Compression Proxy
  bambu-bridge:
    image: docker.io/alexxit/go2rtc:master
    container_name: bambu_obico_bridge
    networks:
      - obico_net
    environment:
      - BAMBU_PRINTER_IP=${BAMBU_PRINTER_IP}
      - BAMBU_ACCESS_CODE=${BAMBU_ACCESS_CODE}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:z   # Explicitly mounts your config layout
    ports:
      - "1984:1984"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 150M
    restart: unless-stopped

  # Core Web Server Engine
  obico-web:
    image: ghcr.io/gabe565/obico/web:latest
    container_name: obico_web_backend
    command: python3 manage.py runserver 0.0.0.0:8000
    networks:
      - obico_net
    ports:
      - "3334:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ML_API_HOST=http://ml-api:5000
    depends_on:
      - db
      - redis
      - ml-api
    volumes:
      - obico_web_data:/app/data:Z
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
    restart: unless-stopped

  # Core Machine Learning AI
  ml-api:
    image: ghcr.io/imagegenius/obico-darknet:latest
    container_name: obico_ml_api
    networks:
      - obico_net
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "3333:5000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 700M
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: obico_redis
    networks:
      - obico_net
    deploy:
      resources:
        limits:
          memory: 100M

  db:
    image: docker.io/library/postgres:15-alpine
    container_name: obico_postgres
    networks:
      - obico_net
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - obico_db_data:/var/lib/postgresql/data:Z
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 250M

volumes:
  obico_db_data:
  obico_web_data:
